global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    scrape_interval: 15s
    static_configs:
      - targets: ['backend:8080']
    metrics_path: /metrics

  - job_name: node_exporter
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
